services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      API_PORT: 3101
      OFFLINE_MODE: "true"
      DATABASE_PROVIDER: sqlite
      DATABASE_MODE: "shared"
      ENABLE_PLATFORM_ADMIN: "false"
      JWT_SECRET: ${JWT_SECRET:-}
      HKDPLUS_INSTANCE_SECRET: ${HKDPLUS_INSTANCE_SECRET:-}
      HKDPLUS_INSTANCE_ID: ${HKDPLUS_INSTANCE_ID:-}
      HKDPLUS_SETUP_TOKEN: ${HKDPLUS_SETUP_TOKEN:-}
      HKDPLUS_PUBLIC_URL: ${HKDPLUS_PUBLIC_URL:-https://hkdsmart.local:6688}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://hkdsmart.local:6687,https://hkdsmart.local:6688,http://localhost:6687,https://localhost:6688,http://127.0.0.1:6687,https://127.0.0.1:6688}
    volumes:
      - tdpos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
        VITE_PRINT_BRIDGE_URL: ${VITE_PRINT_BRIDGE_URL:-/print-bridge}
        VITE_PRINT_BRIDGE_TOKEN: ${VITE_PRINT_BRIDGE_TOKEN:-}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      HKDPLUS_HOSTNAME: ${HKDPLUS_HOSTNAME:-hkdsmart.local}
      HKDPLUS_HTTPS_PORT: ${WEB_HTTPS_PORT:-6688}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Replace the online gateway bindings when this file is layered on top of
    # docker-compose.yml; otherwise Compose keeps both port lists and Docker
    # tries to bind the same host port twice.
    ports: !override
      - "${WEB_HTTP_PORT:-6687}:80"
      - "${WEB_HTTPS_PORT:-6688}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tdpos_data:
  caddy_data:
  caddy_config:
