  <body>
    <script>
      (() => {
        const hostname = window.location.hostname;
        const isLoopback = /^(localhost|127(?:\.\d{1,3}){3}|\[::1\])$/i.test(hostname);
        const isPrivateNetwork = /^(10|192\.168)\.\d{1,3}\.\d{1,3}$/.test(hostname)
          || /^172\.(1[6-9]|2\d|3[0-1])\.\d{1,3}\.\d{1,3}$/.test(hostname)
          || hostname.endsWith('.local');

        if (window.location.protocol === 'http:' && !isLoopback && !isPrivateNetwork) {
          const port = window.location.port && window.location.port !== '80' ? `:${window.location.port}` : '';
          window.location.replace(`https://${hostname}${port}${window.location.pathname}${window.location.search}${window.location.hash}`);
        }
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
