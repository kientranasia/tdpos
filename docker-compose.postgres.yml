services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tdpos_saas}
      POSTGRES_USER: ${POSTGRES_USER:-tdpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - tdpos_saas_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api.postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      API_PORT: 3101
      OFFLINE_MODE: "false"
      DATABASE_PROVIDER: postgres
      DATABASE_MODE: shared
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-tdpos_saas}
      POSTGRES_USER: ${POSTGRES_USER:-tdpos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ENABLE_PLATFORM_ADMIN: ${ENABLE_PLATFORM_ADMIN:-true}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-HKD Smart Platform}
      ADMIN_BOOTSTRAP_ROLE: ${ADMIN_BOOTSTRAP_ROLE:-super_admin}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      HKDPLUS_INSTANCE_SECRET: ${HKDPLUS_INSTANCE_SECRET:?HKDPLUS_INSTANCE_SECRET must be set}
      HKDPLUS_SETUP_TOKEN: ${HKDPLUS_SETUP_TOKEN:-}
      HKDPLUS_PUBLIC_URL: ${HKDPLUS_PUBLIC_URL:-https://hkdsmart-pg.trandao.vn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hkdsmart-pg.trandao.vn}
      HKDPLUS_HOSTNAME: ${HKDPLUS_HOSTNAME:-hkdsmart-pg.trandao.vn}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      HKDPLUS_HOSTNAME: ${HKDPLUS_HOSTNAME:-hkdsmart-pg.trandao.vn}
    ports:
      - "127.0.0.1:${WEB_HTTP_PORT:-6666}:80"
    volumes:
      - ./docker/caddy/Caddyfile.online:/etc/caddy/Caddyfile:ro
      - tdpos_saas_caddy_data:/data
      - tdpos_saas_caddy_config:/config

volumes:
  tdpos_saas_pg_data:
  tdpos_saas_caddy_data:
  tdpos_saas_caddy_config:
