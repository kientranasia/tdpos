services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      API_PORT: 3101
      OFFLINE_MODE: ${OFFLINE_MODE:-true}
      JWT_SECRET: ${JWT_SECRET:-}
      HKDPLUS_INSTANCE_SECRET: ${HKDPLUS_INSTANCE_SECRET:-}
      HKDPLUS_SETUP_TOKEN: ${HKDPLUS_SETUP_TOKEN:-}
      HKDPLUS_PUBLIC_URL: ${HKDPLUS_PUBLIC_URL:-https://hkdplus.lan}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      HKDPLUS_LICENSE_PUBLIC_KEY: ${HKDPLUS_LICENSE_PUBLIC_KEY:-}
      HKDPLUS_LICENSE_SERVER_URL: ${HKDPLUS_LICENSE_SERVER_URL:-}
    volumes:
      - tdpos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      HKDPLUS_HOSTNAME: ${HKDPLUS_HOSTNAME:-hkdplus.lan}
    ports:
      - "${WEB_HTTP_PORT:-80}:80"
      - "${WEB_HTTPS_PORT:-443}:443"
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tdpos_data:
  caddy_data:
  caddy_config:
