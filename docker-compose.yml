services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      API_PORT: 3101
      # The default Compose stack is for the online deployment behind
      # Cloudflare Tunnel. Use docker-compose.offline.yml for LAN/offline.
      OFFLINE_MODE: ${OFFLINE_MODE:-false}
      DATABASE_MODE: ${DATABASE_MODE:-per_tenant}
      ENABLE_PLATFORM_ADMIN: ${ENABLE_PLATFORM_ADMIN:-true}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-HKD Smart Platform}
      ADMIN_BOOTSTRAP_ROLE: ${ADMIN_BOOTSTRAP_ROLE:-super_admin}
      JWT_SECRET: ${JWT_SECRET:-}
      HKDPLUS_INSTANCE_SECRET: ${HKDPLUS_INSTANCE_SECRET:-}
      HKDPLUS_SETUP_TOKEN: ${HKDPLUS_SETUP_TOKEN:-}
      HKDPLUS_PUBLIC_URL: ${HKDPLUS_PUBLIC_URL:-https://hkdsmart.trandao.vn}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://hkdsmart.trandao.vn}
      HKDPLUS_LICENSE_PUBLIC_KEY: ${HKDPLUS_LICENSE_PUBLIC_KEY:-}
      HKDPLUS_LICENSE_SERVER_URL: ${HKDPLUS_LICENSE_SERVER_URL:-}
    volumes:
      - tdpos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s

  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      web:
        condition: service_healthy
    environment:
      HKDPLUS_HOSTNAME: ${HKDPLUS_HOSTNAME:-hkdsmart.trandao.vn}
    ports:
      # Cloudflare Tunnel connects to this HTTP origin. Public HTTPS is
      # terminated by Cloudflare, not by the origin container.
      - "${WEB_HTTP_PORT:-6666}:80"
    volumes:
      - ./docker/caddy/Caddyfile.online:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  tdpos_data:
  caddy_data:
  caddy_config:
