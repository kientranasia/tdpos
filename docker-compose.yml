services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    restart: unless-stopped
    environment:
      API_PORT: 3101
      JWT_SECRET: ${JWT_SECRET:-hkdplus-dev-secret-change-me}
      HKDPLUS_INSTANCE_SECRET: ${HKDPLUS_INSTANCE_SECRET:-change-this-instance-secret}
      HKDPLUS_LICENSE_PUBLIC_KEY: ${HKDPLUS_LICENSE_PUBLIC_KEY:-}
      HKDPLUS_LICENSE_SERVER_URL: ${HKDPLUS_LICENSE_SERVER_URL:-}
      ADMIN_BOOTSTRAP_EMAIL: ${ADMIN_BOOTSTRAP_EMAIL:-admin@hkdplus.local}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-123456}
      ADMIN_BOOTSTRAP_NAME: ${ADMIN_BOOTSTRAP_NAME:-Quản trị HKDPlus}
      ADMIN_BOOTSTRAP_ROLE: ${ADMIN_BOOTSTRAP_ROLE:-super_admin}
    volumes:
      - tdpos_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3101/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PUBLIC_PORT:-80}:80"

volumes:
  tdpos_data:
