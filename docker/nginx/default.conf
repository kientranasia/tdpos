server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header Permissions-Policy "camera=(self)" always;

  # HTTPS is terminated by the front proxy:
  # - Cloudflare at the public edge for the online deployment; or
  # - Caddy for the offline deployment.
  # Do not redirect here. The Caddy-to-Nginx hop is HTTP by design and a
  # redirect based on X-Forwarded-Proto would loop behind Cloudflare Tunnel.

  location /api/ {
    proxy_pass http://api:3101/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
