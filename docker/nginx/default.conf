server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;
  add_header Permissions-Policy "camera=(self)" always;

  # TLS is terminated by the public reverse proxy/Cloudflare. Keep direct
  # HTTP visits from loading the app as an insecure origin, which blocks
  # phone camera access, and send them to the HTTPS URL instead.
  if ($http_x_forwarded_proto = "http") {
    return 301 https://$host$request_uri;
  }

  location /api/ {
    proxy_pass http://api:3101/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
